events {
    worker_connections 1024;
}

http {

    upstream frontend {
        server frontend:80;
    }

    upstream backend {
        server backend:8086;
    }

    upstream ai_backend {
        server ai-backend:8000;
    }

    upstream backoffice {
        server backoffice:80;
    }


    # ========================================================================
    # Frontend
    # ========================================================================

    server {
        listen 80;
        server_name _;

        # ---------------------------------------------------------------
        # Frontend
        # ---------------------------------------------------------------

        location / {
            proxy_pass http://frontend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # ---------------------------------------------------------------
        # Spring Boot API
        # ---------------------------------------------------------------

        location /api/ {
            proxy_pass http://backend;
        
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # ---------------------------------------------------------------
        # WebSocket
        # ---------------------------------------------------------------

        location /ws/ {
            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # ---------------------------------------------------------------
        # AI Backend
        # ---------------------------------------------------------------

        location /ai/ {
            proxy_pass http://ai_backend/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # ---------------------------------------------------------------
        # Uploads
        # ---------------------------------------------------------------

        location /uploads/ {
            proxy_pass http://backend/uploads/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }


    # ========================================================================
    # PRIVATE BACKOFFICE
    # ========================================================================
    #
    # Do NOT expose this server publicly.
    #
    # This block should eventually be reachable only through Tailscale.
    #
    # ========================================================================

    server {
        listen 80;

        server_name backoffice.kidora.internal;

        location / {
            proxy_pass http://backoffice;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}