services:
  backend:
    image: localhost:5000/kidora-backend:latest
    container_name: backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - minio
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "8086"
    ports:
      - "8086:8086"
    networks:
      - kidora_net