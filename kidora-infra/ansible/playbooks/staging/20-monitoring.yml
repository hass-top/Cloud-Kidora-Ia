---
# =============================================================================
#  20 — Monitoring: srv1 (Prometheus + Grafana + Alertmanager + exporters)
# =============================================================================
#  Deployed on the monitoring host only. It scrapes the node-exporter and
#  cAdvisor instances running on the other two servers, so it is only fully
#  populated once 30-app.yml has run.
# =============================================================================

- name: Monitoring — deploy the Prometheus, Grafana and Alertmanager stack
  hosts: kidora_monitoring
  become: true
  gather_facts: true

  roles:
    - role: prometheus_stack
      tags: [monitoring, prometheus, grafana]
