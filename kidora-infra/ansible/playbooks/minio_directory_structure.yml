---
- name: Create MinIO bucket structure for Kidora
  hosts: all
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Create Kidora buckets
      ansible.builtin.shell: |
        docker exec minio mc alias set myminio http://localhost:9000 {{ minio_root_user }} {{ minio_root_password }}
        docker exec minio mc mb --ignore-existing myminio/kidora
        docker exec minio mc mb --ignore-existing myminio/kidora/enfants
        docker exec minio mc mb --ignore-existing myminio/kidora/users
        docker exec minio mc mb --ignore-existing myminio/kidora/ressources
        docker exec minio mc mb --ignore-existing myminio/kidora/galerie
        docker exec minio mc mb --ignore-existing myminio/kidora/demandes
        docker exec minio mc mb --ignore-existing myminio/kidora/admins
        docker exec minio mc mb --ignore-existing myminio/kidora/contrats
        docker exec minio mc mb --ignore-existing myminio/kidora/certificats
        docker exec minio mc mb --ignore-existing myminio/kidora/archives
        docker exec minio mc mb --ignore-existing myminio/kidora/activities
        docker exec minio mc mb --ignore-existing myminio/kidora/fournisseurs
        docker exec minio mc mb --ignore-existing myminio/kidora/uploads
        docker exec minio mc mb --ignore-existing myminio/kidora/chat
      register: bucket_result
      changed_when: bucket_result.rc == 0
      failed_when: bucket_result.rc != 0

    - name: Display MinIO result
      ansible.builtin.debug:
        var: bucket_result.stdout
