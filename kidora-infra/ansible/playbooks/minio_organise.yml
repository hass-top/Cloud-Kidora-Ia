---
- name: Configure MinIO anonymous public read+write access
  hosts: all
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Set anonymous public read+write on kidora bucket
      ansible.builtin.shell: |
        docker exec minio mc alias set myminio http://localhost:9000 {{ minio_root_user }} {{ minio_root_password }}
        docker exec minio mc anonymous set public myminio/kidora
      register: mc_result
      changed_when: "'public' in mc_result.stdout"
