---
- name: Install and configure Tailscale
  hosts: all
  become: true
  vars:
    # Order: vault_tailscale_auth_key (from vault.yml) > TAILSCALE_AUTH_KEY env var > empty
    tailscale_auth_key: "{{ vault_tailscale_auth_key | default(ansible_env.TAILSCALE_AUTH_KEY | default('')) }}"
    tailscale_accept_routes: "{{ tailscale_accept_routes | default(true) | bool }}"
    tailscale_accept_dns: "{{ tailscale_accept_dns | default(true) | bool }}"
    tailscale_exit_node_enabled: "{{ tailscale_exit_node_enabled | default(false) | bool }}"
    tailscale_exit_node_ip: "{{ tailscale_exit_node_ip | default('') }}"
    tailscale_tags: "{{ tailscale_tags | default([]) }}"
    # If true, forces re-authentication every run. Default false.
    tailscale_force_reconnect: "{{ tailscale_force_reconnect | default(false) | bool }}"
  tasks:
    - name: Install required packages for Tailscale repository
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
        state: present
      register: apt_task
      until: apt_task is succeeded
      retries: 3
      delay: 5

    - name: Add Tailscale GPG key
      shell: curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/focal.gpg | apt-key add -
      args:
        creates: /etc/apt/trusted.gpg.d/tailscale-archive-keyring.gpg
      register: gpg_task
      until: gpg_task is succeeded
      retries: 3
      delay: 5

    - name: Add Tailscale repository
      shell: curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/focal.list | tee /etc/apt/sources.list.d/tailscale.list
      args:
        creates: /etc/apt/sources.list.d/tailscale.list
      register: repo_task
      until: repo_task is succeeded
      retries: 3
      delay: 5

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      register: update_task
      until: update_task is succeeded
      retries: 3
      delay: 5

    - name: Install Tailscale
      apt:
        name: tailscale
        state: present
      register: install_task
      until: install_task is succeeded
      retries: 3
      delay: 5

    - name: Start and enable Tailscale service
      systemd:
        name: tailscaled
        enabled: yes
        state: started
      register: service_task
      until: service_task is succeeded
      retries: 3
      delay: 5

    - name: Ensure Tailscale state file exists (idempotency marker)
      file:
        path: /var/lib/tailscale/tailscaled.state
        state: touch
        mode: '0644'

    - name: Build Tailscale up arguments
      set_fact:
        tailscale_up_args: >-
          --authkey {{ tailscale_auth_key }}
          --accept-routes={{ tailscale_accept_routes | bool | lower }}
          --accept-dns={{ tailscale_accept_dns | bool | lower }}
          {% if tailscale_exit_node_enabled | bool %}--exit-node={{ tailscale_exit_node_ip }}{% endif %}
          {{ '--reset' if tailscale_force_reconnect | bool else '' }}

    - name: Authenticate Tailscale using auth key
      shell: "tailscale up {{ tailscale_up_args }}"
      register: tailscale_up_result
      changed_when: "'already authenticated' not in tailscale_up_result.stdout"
      failed_when:
        - tailscale_up_result.rc != 0
        - "'authentication required' not in tailscale_up_result.stderr"
      environment:
        TAILSCALE_AUTH_KEY: "{{ tailscale_auth_key }}"
      when: tailscale_auth_key != ''
