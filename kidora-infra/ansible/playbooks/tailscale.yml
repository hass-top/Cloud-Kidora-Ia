---
- name: Install and configure Tailscale
  hosts: all
  become: true
  vars:
    # Order: vault_tailscale_auth_key (from vault.yml) > TAILSCALE_AUTH_KEY env var > empty
    tailscale_auth_key: "{{ vault_tailscale_auth_key | default(ansible_env.TAILSCALE_AUTH_KEY | default('')) }}"
  tasks:
    - name: Install required packages for Tailscale repository
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
        state: present
      register: apt_task
      until: apt_task is succeeded
      retries: 3
      delay: 5

    - name: Download Tailscale GPG key
      get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'
      register: gpg_task
      until: gpg_task is succeeded
      retries: 3
      delay: 5

    - name: Remove any stale Tailscale apt sources (cleanup broken entries from previous runs)
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/tailscale.list
        - /etc/apt/sources.list.d/tailscale.sources

    - name: Add Tailscale repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu noble main"
        state: present
        update_cache: yes
      register: repo_task
      until: repo_task is succeeded
      retries: 3
      delay: 5

    - name: Install Tailscale
      apt:
        name: tailscale
        state: present
      register: install_task
      until: install_task is succeeded
      retries: 3
      delay: 5

    - name: Start and enable Tailscale service
      systemd:
        name: tailscaled
        enabled: yes
        state: started
      register: service_task
      until: service_task is succeeded
      retries: 3
      delay: 5

    - name: Ensure Tailscale state file exists (idempotency marker)
      file:
        path: /var/lib/tailscale/tailscaled.state
        state: touch
        mode: '0644'

    - name: Build Tailscale up arguments
      set_fact:
        tailscale_up_args: >-
          --authkey {{ tailscale_auth_key }}
          --accept-routes={{ tailscale_accept_routes | default(true) | bool | lower }}
          --accept-dns={{ tailscale_accept_dns | default(true) | bool | lower }}
          {% if tailscale_exit_node_enabled | default(false) | bool %}--exit-node={{ tailscale_exit_node_ip | default('') }}{% endif %}
          {{ '--reset' if tailscale_force_reconnect | default(false) | bool else '' }}

    - name: Authenticate Tailscale using auth key
      shell: "tailscale up {{ tailscale_up_args }}"
      register: tailscale_up_result
      changed_when: "'already authenticated' not in tailscale_up_result.stdout"
      failed_when:
        - tailscale_up_result.rc != 0
        - "'authentication required' not in tailscale_up_result.stderr"
      environment:
        TAILSCALE_AUTH_KEY: "{{ tailscale_auth_key }}"
      when: tailscale_auth_key != ''