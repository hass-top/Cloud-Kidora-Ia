---
- name: Ensure snapd is installed
  apt:
    name: snapd
    state: present
  when: ansible_os_family == "Debian"

- name: Ensure core snap is installed
  command: snap install core
  args:
    creates: /snap/core/current
  register: snap_core_result
  changed_when: "'installed' in snap_core_result.stdout"
  when: ansible_os_family == "Debian"

- name: Install certbot via snap
  command: snap install certbot --classic
  args:
    creates: /snap/bin/certbot
  register: snap_certbot_result
  changed_when: "'installed' in snap_certbot_result.stdout"
  when: ansible_os_family == "Debian"

- name: Create symlink for certbot command
  file:
    src: /snap/bin/certbot
    dest: /usr/bin/certbot
    state: link
  when: ansible_os_family == "Debian"

- name: Create webroot directory for standalone mode
  file:
    path: "{{ certbot_webroot_path }}"
    state: directory
    mode: "0755"
  when: not certbot_install_nginx_plugin

- name: Obtain SSL certificate using nginx plugin
  command: >
    certbot --nginx
    -d {{ item }}
    --non-interactive
    --agree-tos
    --email {{ certbot_email }}
    --redirect
  loop: "{{ certbot_domains }}"
  register: certbot_nginx_result
  changed_when: "'Congratulations!' in certbot_nginx_result.stdout"
  when: certbot_install_nginx_plugin

- name: Obtain SSL certificate using standalone mode
  command: >
    certbot certonly
    --standalone
    -d {{ item }}
    --non-interactive
    --agree-tos
    --email {{ certbot_email }}
  loop: "{{ certbot_domains }}"
  register: certbot_standalone_result
  changed_when: "'Congratulations!' in certbot_standalone_result.stdout"
  when: not certbot_install_nginx_plugin

- name: Set up automatic renewal
  template:
    src: certbot-renew.j2
    dest: /etc/cron.d/certbot-renew
    owner: root
    group: root
    mode: "0644"
  vars:
    certbot_renewal_frequency: "{{ certbot_renewal_frequency }}"

- name: Enable certbot timer (systemd)
  systemd:
    name: certbot.timer
    enabled: yes
    state: started
  ignore_errors: yes