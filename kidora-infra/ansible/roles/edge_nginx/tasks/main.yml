---
# =============================================================================
#  edge_nginx — the public reverse proxy
# =============================================================================
#  Runs on the kidora_edge host only (see playbooks/staging/40-edge.yml).
# =============================================================================

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Ensure the nginx directory layout exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/nginx/conf.d
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
    - /etc/nginx/snippets
    - "{{ certbot_webroot_path }}/.well-known/acme-challenge"

# --- Remove the stock site ---------------------------------------------------
# Ubuntu's default vhost serves /var/www/html on port 80 and would answer for
# requests with a mismatched Host header, which is exactly what an attacker
# sends. Every vhost here is explicitly named instead.
- name: Remove the default nginx site
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/sites-available/default

- name: Remove the packaged default vhost
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent

# --- Configuration -----------------------------------------------------------
# The main config is only ever written when it changes: replacing it triggers
# a reload, and an unconditional write would reload nginx on every single run.
- name: Deploy the main nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    # Validated before it is put in place, so a bad template never replaces a
    # working config and leaves the edge with no web server at all.
    validate: "nginx -t -c %s"
  notify: reload nginx

- name: Deploy the shared proxy snippet
  ansible.builtin.template:
    src: kidora-proxy.conf.j2
    dest: /etc/nginx/snippets/kidora-proxy.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

# --- Choose the vhost set ----------------------------------------------------
# `nginx -t` FAILS if a vhost references a certificate file that does not exist
# yet, and there is no certificate until certbot has run. So the first run
# installs the plain-HTTP bootstrap vhost; every later run installs the real
# TLS vhosts. Checking for the certificate first is what keeps both cases
# working without a flag to remember to flip.
- name: Check whether a TLS certificate has already been issued
  ansible.builtin.stat:
    path: "{{ ssl_certificate_path }}"
  register: existing_certificate

- name: Deploy the public vhost
  ansible.builtin.template:
    src: kidora.conf.j2
    dest: /etc/nginx/conf.d/kidora.conf
    owner: root
    group: root
    mode: "0644"
    # Validated before it is put in place, so a broken template never replaces
    # a working config and leaves the edge with no web server at all.
    validate: "nginx -t -c %s"
  when: existing_certificate.stat.exists
  notify: reload nginx

- name: Deploy the backoffice vhost
  ansible.builtin.template:
    src: backoffice.conf.j2
    dest: /etc/nginx/conf.d/backoffice.conf
    owner: root
    group: root
    mode: "0640"
  when:
    - existing_certificate.stat.exists
    - backoffice_vhost.enabled | bool
  notify: reload nginx

- name: Fall back to the HTTP-only bootstrap vhost
  ansible.builtin.template:
    src: http-bootstrap.conf.j2
    dest: /etc/nginx/conf.d/kidora.conf
    owner: root
    group: root
    mode: "0644"
  when: not existing_certificate.stat.exists
  notify: reload nginx

- name: Remove a stale backoffice vhost before a certificate exists
  # Otherwise a previous run's backoffice.conf would be validated by nginx
  # together with the bootstrap vhost and fail on the missing certificate.
  ansible.builtin.file:
    path: /etc/nginx/conf.d/backoffice.conf
    state: absent
  when: not existing_certificate.stat.exists

# --- Log rotation ------------------------------------------------------------
# Without this nginx's access log grows until the disk fills, which on a
# low-traffic host can take months to notice.
- name: Install the nginx logrotate policy
  ansible.builtin.copy:
    dest: /etc/logrotate.d/kidora-nginx
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/nginx/*.log {
          daily
          missingok
          rotate 14
          compress
          delaycompress
          notifempty
          create 0640 adm adm
          sharedscripts
          postrotate
              if [ -f /var/run/nginx.pid ]; then
                  /usr/sbin/nginx -s reopen
              fi
          endscript
      }

# --- First start, before a certificate exists --------------------------------
# The vhost choice above already handled the bootstrap case; this only has to
# make sure nginx is actually listening before certbot runs against it.
- name: Ensure nginx is running and enabled
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Validate the final nginx configuration
  ansible.builtin.command: nginx -t
  register: nginx_syntax
  changed_when: false

- name: Report the nginx state
  ansible.builtin.debug:
    msg:
      - "nginx configuration is valid on {{ inventory_hostname }}"
      - "TLS vhost      : {{ 'deployed' if existing_certificate.stat.exists else 'PENDING (HTTP bootstrap only)' }}"
      - "Certificate    : {{ ssl_certificate_path }}"
      - "Public site    : https://{{ domain_name }}"
      - "Backoffice     : https://{{ backoffice_vhost.server_name }} (tailnet only)"
