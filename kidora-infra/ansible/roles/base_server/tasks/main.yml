---
# =============================================================================
#  base_server — kernel and resource tuning for the container workload
# =============================================================================
#  roles/common already handles packages, timezone, NTP, unattended upgrades and
#  a 1 GB swapfile. This role adds the settings that matter specifically for
#  running MongoDB and many small containers, and complements rather than
#  duplicates it.
# =============================================================================

# --- Swap --------------------------------------------------------------------
# The Terraform plan for these servers is 2 GB of RAM. With MongoDB's WiredTiger
# cache, a JVM heap and Grafana all on one box, the OOM killer picks a victim
# and it is rarely the one you would have chosen. A swapfile absorbs the spike.
# vm.swappiness=10 (set in roles/common) keeps the kernel preferring RAM, so
# swap is a safety net rather than a substitute for memory.
- name: Check whether the swapfile already exists
  ansible.builtin.stat:
    path: "{{ swap_file }}"
  register: swapfile_stat

- name: Create the swapfile
  ansible.builtin.command:
    cmd: "fallocate -l {{ swap_size }} {{ swap_file }}"
  when: not swapfile_stat.stat.exists
  changed_when: true

- name: Restrict the swapfile to root
  # 0600: a world-readable swapfile leaks whatever was paged out of memory,
  # which on this host means the MongoDB contents.
  ansible.builtin.file:
    path: "{{ swap_file }}"
    state: file
    owner: root
    group: root
    mode: "0600"

- name: Initialise the swapfile
  # `swapon` fails if the file is not a swap device yet, and the initialise
  # step must run before the first activation. Both are guarded so repeat runs
  # are no-ops.
  ansible.builtin.command:
    cmd: "swapon {{ swap_file }}"
  register: swap_activate
  failed_when: false
  changed_when: false

- name: Check whether the swapfile is active
  ansible.builtin.command:
    cmd: "swapon --show=NAME --noheadings"
  register: active_swaps
  changed_when: false

- name: Initialise the swapfile if it is not yet a swap device
  ansible.builtin.command:
    cmd: "mkswap {{ swap_file }}"
  when: swap_file not in active_swaps.stdout
  changed_when: true

- name: Activate the swapfile
  ansible.builtin.command:
    cmd: "swapon {{ swap_file }}"
  when: swap_file not in active_swaps.stdout
  changed_when: true

- name: Persist the swapfile across reboots
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^{{ swap_file | regex_escape }}\\s"
    line: "{{ swap_file }} none swap sw 0 0"
    state: present

# --- Kernel ------------------------------------------------------------------
# These are the values the container workloads actually depend on. A swap that
# fills (vm.swappiness), a full accept queue under load (somaxconn, backlog), and
# the conntrack table, which a busy proxy exhausts and then silently drops
# packets — a failure that looks exactly like "the internet is slow".
- name: Apply kernel tuning for the container workload
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-kidora.conf
    reload: true
  loop:
    - { name: vm.swappiness,            value: "10" }
    - { name: vm.overcommit_memory,     value: "1" }
    - { name: net.core.somaxconn,       value: "65535" }
    - { name: net.ipv4.tcp_max_syn_backlog, value: "65535" }
    - { name: net.ipv4.ip_local_port_range, value: "10240 65535" }
    - { name: net.ipv4.tcp_fin_timeout, value: "15" }
    - { name: net.ipv4.tcp_keepalive_time, value: "300" }
    - { name: net.netfilter.nf_conntrack_max, value: "1048576" }
    - { name: fs.file-max,              value: "1048576" }
    - { name: fs.inotify.max_user_instances, value: "8192" }
  loop_control:
    label: "{{ item.name }}"
  # net.netfilter.nf_conntrack_max only exists once the conntrack module is
  # loaded; on a fresh kernel the key is absent and the task would fail.
  ignore_errors: "{{ item.name == 'net.netfilter.nf_conntrack_max' }}"

# --- Container prerequisites --------------------------------------------------
- name: Ensure the bridge-nf sysctl is loaded
  # Docker's bridge networking needs this, and it does not survive a reboot on
  # every kernel.
  ansible.builtin.command:
    cmd: "modprobe bridge"
  changed_when: false

- name: Persist bridge-nf-call-iptables
  ansible.posix.sysctl:
    name: net.bridge.bridge-nf-call-iptables
    value: "1"
    state: present
    reload: true
  failed_when: false
  changed_when: false

- name: Ensure br_netfilter is loaded at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kidora.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      bridge
      br_netfilter
      overlay
