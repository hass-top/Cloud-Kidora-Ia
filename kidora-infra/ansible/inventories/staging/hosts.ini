# =============================================================================
#  Kidora — Staging inventory (3 servers, Docker Compose)
# =============================================================================
#  The addresses below are the RFC 5737 TEST-NET-3 documentation range
#  (203.0.113.0/24). They are deliberately NOT routable: a forgotten value
#  fails fast and loudly instead of silently hitting the wrong host.
#
#  Replace each one with the real server IP before running anything:
#
#      kidora_monitoring  srv1  Prometheus + Grafana + exporters
#      kidora_app         srv2  MongoDB + backend + frontend + backoffice
#                                + AI + MinIO
#      kidora_edge        srv3  Nginx + Certbot + Tailscale
#
#  This mirrors the host layout Terraform already provisions in
#  terraform/hetzner/environments/preprod/main.tf (app / database / monitoring).
#
#  The host entries are bare IPs on purpose: playbooks resolve peers with
#  groups['kidora_app'][0] etc., which yields the address directly.
# =============================================================================

[kidora_monitoring]
192.168.56.101

[kidora_app]
192.168.56.103

[kidora_edge]
192.168.56.102

# --- Aggregate group: one target for "all three servers" ---------------------
# 00/10/15-tailscale.yml say `hosts: kidora`, which resolves through here.
#
# NB: do NOT add alias groups such as [app_servers] containing the *name* of a
# group. In an INI inventory every entry under a group header is registered as a
# HOST, so [app_servers] + `kidora_app` would register a second, address-less
# host called `kidora_app` and collide with the group of the same name. To alias
# a group, add the group's hosts (or the group name under a `:children` header).
[kidora:children]
kidora_monitoring
kidora_app
kidora_edge

# --- Per-role markers, consumed by verify.yml and the role playbooks ----------
[kidora_monitoring:vars]
kidora_role=monitoring

[kidora_app:vars]
kidora_role=app

[kidora_edge:vars]
kidora_role=edge

[all:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
# NB: `environment` is a reserved name in Ansible and is NOT set here — it is a
# task keyword, so an inventory var of that name is ignored and warns. The
# staging value lives in group_vars/all.yml instead.
