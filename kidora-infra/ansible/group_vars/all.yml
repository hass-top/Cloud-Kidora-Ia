# AI Backend Configuration
groq_api_key: "set_your_groq_api_key_here"
groq_model_name: "llama3-70b-8192"
groq_vision_model: "llama-vision"
llm_temperature: 0.7
llm_max_tokens: 1024
llm_memory_window: 10

# Application Configuration
app_name: "kidora"
environment: "development"
debug: true
allowed_origins: "http://localhost:5173,http://localhost:3000"
log_level: "INFO"

# External API Keys
bfl_api_key: "YOUR_BFL_API_KEY_HERE"
image_provider: "pollinations"
pollinations_api_key: ""

# Backend Configuration
spring_boot_base_url: "http://localhost:8080"

# SSH Hardening Configuration
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_pubkey_authentication: "yes"
ssh_challenge_response_auth: "no"
ssh_empty_passwords: "no"
ssh_kerberos_authentication: "no"
ssh_gssapi_authentication: "no"
ssh_hostbased_authentication: "no"
ssh_ignore_rhosts: "yes"
ssh_rhosts_rsa_authentication: "no"
ssh_max_auth_tries: 3
ssh_max_sessions: 10
ssh_max_startups: "10:30:60"
ssh_login_grace_time: "30"
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 2
ssh_tcp_keep_alive: "no"
ssh_compression: "no"
ssh_x11_forwarding: "no"
ssh_allow_agent_forwarding: "yes"
ssh_allow_tcp_forwarding: "no"
ssh_gateway_ports: "no"
ssh_permit_tunnel: "no"
ssh_log_level: "INFO"
ssh_syslog_facility: "AUTH"
ssh_print_motd: "yes"
ssh_print_last_log: "yes"
ssh_use_pam: "yes"
ssh_strict_modes: "yes"
ssh_permit_user_environment: "no"
ssh_allow_users: "kidora_hassine kidora_fatma kidora_wael kidora_youssef kidora_ali"
ssh_allow_groups: "kidora_admin kidora_dev"
ssh_deny_users: ""
ssh_deny_groups: ""
ssh_ciphers: "chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr"
ssh_kex_algorithms: "curve25519-sha256,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256"
ssh_macs: "umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com"
ssh_host_key_algorithms: "ssh-ed25519,ssh-rsa"
ssh_fail2ban_enabled: true

